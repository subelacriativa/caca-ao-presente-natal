<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Caça ao Presente</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/matthewbryancurtis/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .ar-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div class="ar-container">

    <a-scene
      mindar-image="imageTargetSrc: ./targets/natal.mind;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <!-- MODELO 3D DO DUENDE -->
      <a-assets>

        <a-asset-item
          id="duende"
          src="./assets/models/duende.glb">
        </a-asset-item>

      </a-assets>


      <!-- CÂMERA -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      >
      </a-camera>


      <!-- TARGET DO CARTÃO -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- DUENDE 3D -->
        <a-gltf-model
          src="#duende"
          position="0 0 0.1"
          scale="0.00008 0.00008 0.00008"
           animation-mixer"clip: ElfArmature|Walk; loop: repeat; timeScale: 0.8">
        >
        </a-gltf-model>

      </a-entity>


    </a-scene>

  </div>

</body>

</html>
