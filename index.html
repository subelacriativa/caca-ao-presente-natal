<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Caça ao Presente</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .ar-container {
      width: 100%;
      height: 100%;
    }

#fala {
  position: fixed;
  left: 5%;
  right: 5%;
  bottom: 25px;

  background: rgba(0, 0, 0, 0.80);
  color: white;

  padding: 18px;
  border-radius: 18px;

  font-family: Arial, sans-serif;
  font-size: 18px;
  text-align: center;

  z-index: 1000;

  display: none;
}

#botaoContinuar {
  margin-top: 14px;

  padding: 12px 25px;

  border: none;
  border-radius: 12px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}
    
  </style>

  <script>
AFRAME.registerComponent('play-animation', {

  init: function () {

    this.mixer = null;

    this.el.addEventListener('model-loaded', (event) => {

      const model = event.detail.model;

      console.log("MODELO CARREGADO NO AR");

      const animations = model.animations || [];

      console.log(
        "ANIMAÇÕES:",
        animations.map(a => a.name)
      );

      if (animations.length === 0) {
        console.error("NENHUMA ANIMAÇÃO ENCONTRADA!");
        return;
      }

      this.mixer =
        new THREE.AnimationMixer(model);

      const clip =
        animations.find(
          animation =>
            animation.name === "ElfArmature|Idle"
        );

      if (!clip) {

        console.error(
          "Idle não encontrado!"
        );

        return;
      }

      console.log(
        "TOCANDO:",
        clip.name
      );

      const action =
        this.mixer.clipAction(
          clip,
          model
        );

      action.setLoop(
        THREE.LoopRepeat,
        Infinity
      );

      action.play();

      console.log(
        "ANIMAÇÃO INICIADA!"
      );
    });
  },

  tick: function (time, deltaTime) {

    if (!this.mixer) {
      return;
    }

    this.mixer.update(
      deltaTime / 1000
    );
  }

});
</script>
  
</head>

<body>

  <div id="fala">

  <div id="textoFala">
    Olá! Que bom que você chegou!
  </div>

  <button id="botaoContinuar">
    Continuar
  </button>

  </div>

  <div class="ar-container">

    <a-scene
      
     mindar-image="
    imageTargetSrc: ./targets/natal.mind;
    filterMinCF: 0.001;
    filterBeta: 0.01;
  "
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
    >

      <!-- MODELO 3D DO DUENDE -->
      <a-assets>

        <a-asset-item
          id="duende"
          src="./assets/models/duende.glb">
        </a-asset-item>

      </a-assets>


      <!-- CÂMERA -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      >
      </a-camera>


      <!-- TARGET DO CARTÃO -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- DUENDE 3D -->
     <a-gltf-model
      src="#duende"
      position="0 0 0.1"
      scale="0.00008 0.00008 0.00008"
      play-animation>
    </a-gltf-model>

      </a-entity>


    </a-scene>

  </div>

  <script>

const fala = document.getElementById("fala");
const botao = document.getElementById("botaoContinuar");

const target =
  document.querySelector(
    '[mindar-image-target="targetIndex: 0"]'
  );

target.addEventListener(
  "targetFound",
  () => {

    console.log("CARTÃO ENCONTRADO!");

    fala.style.display = "block";

  }
);

target.addEventListener(
  "targetLost",
  () => {

    console.log("CARTÃO PERDIDO");

    fala.style.display = "none";

  }
);

botao.addEventListener(
  "click",
  () => {

    document.getElementById("textoFala").textContent =
      "Muito bem! Agora preciso da sua ajuda para encontrar uma coisa...";

  }
);

</script>

</body>

</html>
